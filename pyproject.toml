[project]
name = "agent-team"
version = "0.1.0"
description = "Multi-agent harness: Planning, PRD, Spec and Implementation with an auditor"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "ddgs>=6.0",
    "trafilatura>=1.12",
    "docker>=7.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
agent-team = "agent_team.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_team"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ddgs.*", "trafilatura.*", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
