# Routing, budgets and review mode. Loaded by agent_team.core.config.
# effort (low, medium, high, xhigh, max) sets how hard the model reasons: Claude's
# effort, or Ollama's reasoning_effort (xhigh and max become high). Cheap Claude roles
# start at low, engineer and architect at medium. The researcher runs locally for
# free, so it keeps gpt-oss's own default of medium.
defaults: {provider: anthropic, model: claude-haiku-5-5, context_budget: 90000, effort: low}
agents:
  researcher: {provider: ollama, model: "gpt-oss:20b", context_budget: 20000, effort: medium}
  architect: {provider: anthropic, model: claude-haiku-5-5, effort: medium}
  engineer: {provider: anthropic, model: claude-haiku-5-5, effort: medium}
stronger_model: {provider: anthropic, model: claude-sonnet-5-5}
fallbacks: [anthropic, ollama]
# Model each provider uses when it stands in for another one.
fallback_models: {anthropic: claude-haiku-5-5, ollama: "gpt-oss:20b"}
budget: {max_usd_per_run: 1.00, max_minutes_per_run: 30}
limits: {max_attempts: 3, max_upstream_reruns: 2, max_concurrent_calls: 4}
review: auto_assumptions

# Gateway details.
retry: {delays_s: [1, 2, 4]}
rate_limits:
  anthropic: {max_concurrent: 4, requests_per_minute: 50}
  ollama: {max_concurrent: 1}
# USD per million tokens, from Anthropic's model table as of 2026-10-06.
prices:
  claude-haiku-5-5: {input_per_mtok: 0.10, output_per_mtok: 0.50}
  claude-sonnet-5-5: {input_per_mtok: 2.00, output_per_mtok: 10.00}
providers:
  anthropic:
    timeout_s: 120
    thinking: {type: adaptive}
    # A thinking block whose earlier history was edited is dropped, not a 400.
    on_history_edit: drop_block
  # reasoning_models: models that take reasoning_effort; others get none.
  ollama: {base_url: "http://localhost:11434/v1", num_ctx: 32768, reasoning_models: [gpt-oss]}
# Fault injection; the --chaos flag overrides this.
chaos: {rate: 0.0, faults: []}
# Custom hooks as "module:function"; each function receives the event bus.
hooks: []
paths: {runs_dir: runs, db: runs/agent_team.db}
# Docker sandbox for model-written code: network off except for install_deps.
sandbox: {image: "python:3.12-slim", cpus: 1.0, memory: 1g, timeout_s: 120, install_timeout_s: 300}
# Researcher web tools: timeouts and size caps.
web: {timeout_s: 20, max_bytes: 2000000, max_chars: 20000, max_results: 8}
